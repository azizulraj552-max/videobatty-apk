name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync AdMob App ID into capacitor.config.json
        shell: bash
        run: |
          if [ -f admob-app-id.txt ]; then
            APPID="$(tr -d '[:space:]' < admob-app-id.txt)"
            if [ -n "$APPID" ]; then
              jq --arg id "$APPID" '.plugins.AdMob.appId = $id' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
            fi
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure AdMob App ID is in AndroidManifest.xml
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f admob-app-id.txt ] && [ -f "$MANIFEST" ]; then
            APPID="$(tr -d '[:space:]' < admob-app-id.txt)"
            if [ -n "$APPID" ] && ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
              sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APPID\"/>\n</application>#" "$MANIFEST"
            fi
          fi

      - name: Decode signing keystore
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > android/app/videobatty-release.keystore

      - name: Write keystore properties
        shell: bash
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=app/videobatty-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=videobatty
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Build signed release APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: videobatty-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: videobatty-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
