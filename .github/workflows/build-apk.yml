name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync AdMob App ID into capacitor.config.json from admob-app-id.txt
        run: |
          APPID=$(cat admob-app-id.txt | tr -d '[:space:]')
          if [ -n "$APPID" ]; then
            jq --arg id "$APPID" '.plugins.AdMob.appId = $id' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
            echo "AdMob App ID synced: $APPID"
            cat capacitor.config.json
          fi

      - name: Add Android platform (fresh each run - always regenerated)
        run: npx cap add android

      - name: Ensure AdMob App ID is in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          APPID=$(cat admob-app-id.txt | tr -d '[:space:]')
          if [ -n "$APPID" ] && ! grep -q "APPLICATION_ID" "$MANIFEST"; then
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APPID\"/>\n</application>#" "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # ================= 🔑 সাইনিং কী ডিকোড ও যাচাই =================
      - name: Check if SIGNING_KEYSTORE_BASE64 secret is set
        run: |
          if [ -z "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "❌ SIGNING_KEYSTORE_BASE64 secret is empty!"
            exit 1
          else
            echo "✅ Secret exists, length: ${#{{ secrets.SIGNING_KEYSTORE_BASE64 }}}"
          fi

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > android/app/videobatty-release.keystore
          echo "Keystore decoded. Checking file size..."
          ls -la android/app/videobatty-release.keystore
          if [ ! -s android/app/videobatty-release.keystore ]; then
            echo "❌ Decoded keystore file is empty! Check your secret."
            exit 1
          fi

      - name: Verify Keystore (পাসওয়ার্ড যাচাই)
        working-directory: android/app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "🔑 Trying to list keystore entries..."
          keytool -list -keystore videobatty-release.keystore -storepass $KEYSTORE_PASSWORD -v
          if [ $? -eq 0 ]; then
            echo "✅ Keystore validated successfully!"
          else
            echo "❌ Keystore validation failed. Check password or file."
            exit 1
          fi

      - name: Configure signing in build.gradle
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("videobatty-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "videobatty"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                      storeType 'PKCS12'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Signed APK (debug variant - direct install/share)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Signed Release APK + AAB (Play Store-ready)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload debug APK (share directly with users)
        uses: actions/upload-artifact@v4
        with:
          name: videobatty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: videobatty-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB (Play Store upload করতে এটা লাগবে)
        uses: actions/upload-artifact@v4
        with:
          name: videobatty-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
