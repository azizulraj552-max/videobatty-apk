name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Sync AdMob App ID into capacitor.config.json
        shell: bash
        run: |
          APPID="$(tr -d '[:space:]' < admob-app-id.txt)"
          if [ -n "$APPID" ]; then
            jq --arg id "$APPID" '.plugins.AdMob.appId = $id' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          fi

      - name: Ensure AdMob App ID is in AndroidManifest.xml
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          APPID="$(tr -d '[:space:]' < admob-app-id.txt)"
          if [ -n "$APPID" ] && ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i "s#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="$APPID"/>
</application>#" "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > android/app/videobatty-release.keystore

      - name: Create gradle properties
        shell: bash
        run: |
          cat > android/gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=videobatty-release.keystore
          MYAPP_RELEASE_KEY_ALIAS=videobatty
          MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Update android app build.gradle signing config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs" not in s:
              s = s.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      storeFile file(MYAPP_RELEASE_STORE_FILE)
                      storePassword MYAPP_RELEASE_STORE_PASSWORD
                      keyAlias MYAPP_RELEASE_KEY_ALIAS
                      keyPassword MYAPP_RELEASE_KEY_PASSWORD
                  }
              }"""
              )
          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "release {",
                  """release {
                      signingConfig signingConfigs.release"""
              )
          p.write_text(s)
          PY

      - name: Build Signed Release APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: videobatty-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: videobatty-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
