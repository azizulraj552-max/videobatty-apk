name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android platform (fresh each run - always regenerated)
        run: npx cap add android

      - name: Ensure AdMob App ID is in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          APPID=$(cat admob-app-id.txt | tr -d '[:space:]')
          if [ -n "$APPID" ] && ! grep -q "APPLICATION_ID" "$MANIFEST"; then
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APPID\"/>\n</application>#" "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # ================= 🔑 স্থায়ী সাইনিং কী (লগইন-হারানো বাগ ফিক্স) =================
      # ⚠️ আগে প্রতিটা GitHub Actions রান নিজে থেকেই একটা নতুন র‍্যান্ডম debug
      # keystore বানাতো, তাই প্রতিটা নতুন APK-কে Android আলাদা "অ্যাপ" হিসেবে
      # ধরে নিত এবং পুরনোটার সব ডেটা (লগইন সেশন) মুছে দিত। এখন GitHub Secret-এ
      # রাখা একটা স্থায়ী কী প্রতিবার ব্যবহার করা হয়, তাই আপডেট হলেও ডেটা থাকবে।
      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > android/app/videobatty-release.keystore

      - name: Configure signing in build.gradle
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("videobatty-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "videobatty"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                      storeType 'PKCS12'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Signed APK (debug variant - direct install/share)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Signed Release APK + AAB (Play Store-ready)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload debug APK (share directly with users)
        uses: actions/upload-artifact@v4
        with:
          name: videobatty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: videobatty-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB (Play Store upload করতে এটা লাগবে)
        uses: actions/upload-artifact@v4
        with:
          name: videobatty-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
